[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [".git", "__pycache__", ".myvenv", "venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["."]
exclude = ["**/__pycache__", ".myvenv", "venv"] #
typeCheckingMode = "basic"
pythonVersion = "3.10"
venvPath = "."
venv = ".myvenv"